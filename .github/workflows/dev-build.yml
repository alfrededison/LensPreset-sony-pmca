# Every push to main replaces the "dev" prerelease with a fresh X.Y.Z-dev.N APK.
name: dev-build

on:
  push:
    branches: [main]

permissions:
  contents: write

# Never cancel a run: one stopped between deleting and recreating the release would leave none.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./tools/test.sh
      - run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-10" "build-tools;35.0.0" > /dev/null
      - name: Build (signed with the project key when the secrets exist)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ANDROID_SDK="$ANDROID_SDK_ROOT" ./build.sh
      - name: Replace the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . tools/version.sh
          cp out/LensPreset.apk "out/LensPreset-$VERSION_NAME.apk"
          (cd out && sha256sum "LensPreset-$VERSION_NAME.apk" > "LensPreset-$VERSION_NAME.apk.sha256")
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev --prerelease --target "$GITHUB_SHA" \
            --title "Development build $VERSION_NAME" \
            --notes "Built from $GITHUB_SHA. Untested development build: install at your own risk." \
            "out/LensPreset-$VERSION_NAME.apk" "out/LensPreset-$VERSION_NAME.apk.sha256"
