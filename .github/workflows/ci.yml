# Pull requests only: on main, dev-build runs the same checks before building the signed APK.
name: ci

on:
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests (engine, profiles, i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./tools/test.sh
      - name: Version numbering across version changes and tags
        run: python3 tools/test_version.py
      - name: Signing configuration and certificate guards
        run: python3 tools/test_signing.py
      - name: Release script tags the release and bumps to the next dev version
        run: python3 tools/test_release.py
      - name: Committed firmware reports still cover the Sony API the app calls
        run: python3 tools/firmware/contract.py --check-reports

  profiles:
    name: profile schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0
      - run: python tools/validate_profiles.py

  build:
    name: APK and firmware tools
    needs: [test, profiles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Android SDK packages
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-10" "build-tools;35.0.0" > /dev/null
      - name: Firmware tool tests (stubs compiled to DEX stand in for firmware)
        run: ANDROID_SDK="$ANDROID_SDK_ROOT" python -m unittest discover -s tools/firmware -p 'test_*.py'
      - run: ANDROID_SDK="$ANDROID_SDK_ROOT" ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LensPreset-apk
          path: |
            out/LensPreset.apk
            out/LensPreset.apk.sha256
