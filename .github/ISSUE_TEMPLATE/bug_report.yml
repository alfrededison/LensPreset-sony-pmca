name: Bug report
description: Something in the app does not work as described.
labels: ["bug"]
body:
  - type: input
    id: setup
    attributes:
      label: Camera, firmware, lens, app version
      placeholder: ILCE-5100, 3.10, Sigma 30mm F1.4, 0.1.0-dev.12
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: "1. Open the app  2. Pick 'Portrait, blurred background'  3. ..."
  - type: textarea
    id: log
    attributes:
      label: LENSPRST/LOG.TXT
      description: The lines around the problem; crashes are logged there too.
      render: text
